# -------------------------------------------------------
# ATTRIBUTION AUTOMATIQUE ET EQUILIBREE
#
# Pensee pour les serveurs ou les clans sont des CAMPS FIXES appartenant au
# serveur, et non des groupes crees par les joueurs. Dans ce cas il n'y a
# aucun chef humain pour accepter les demandes d'adhesion, et elles
# s'empileraient indefiniment.
#
# Quand enabled vaut true :
#   - /clan join IGNORE l'argument de clan et attribue au joueur le camp le
#     MOINS PEUPLE de la liste ci-dessous, sans demande ni validation
#   - l'ecart entre les camps ne depasse donc jamais un membre
#   - le comptage se fait sur l'etat reel de clans.yml a chaque attribution,
#     donc un depart par /clan leave ou /clan kick est rattrape tout seul par
#     l'attribution suivante
#
# En cas d'egalite, c'est le premier de la liste qui l'emporte.
# Il faut au moins deux clans pour que le mode s'active.
#
# Les clans doivent exister (/clan create) avant d'etre listes ici.
Auto_Balance:
  enabled: false
  clans: []
